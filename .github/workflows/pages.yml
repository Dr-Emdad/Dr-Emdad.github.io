
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - pages

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check runner resources
        run: |
          echo "=== Memory ==="
          free -h

          echo "=== Disk space ==="
          df -h /

          echo "=== Existing swap ==="
          swapon --show

      - name: Configure 6 GiB swap
        run: |
          set -e

          SWAPFILE=/swapfile
          TARGET_BYTES=$((6 * 1024 * 1024 * 1024))

          if [ -e "$SWAPFILE" ]; then
            if swapon --noheadings --raw --show=NAME | grep -Fxq "$SWAPFILE"; then
              sudo swapoff "$SWAPFILE"
            fi
            sudo rm -f "$SWAPFILE"
          fi

          AVAILABLE_BYTES=$(df -PB1 / | awk 'NR==2 {print $4}')

          if [ "$AVAILABLE_BYTES" -lt "$TARGET_BYTES" ]; then
            echo "ERROR: Insufficient disk space for 6 GiB swap"
            exit 1
          fi

          sudo fallocate -l 6G "$SWAPFILE"
          sudo chmod 600 "$SWAPFILE"
          sudo mkswap "$SWAPFILE"
          sudo swapon "$SWAPFILE"

          echo "=== Verify swap ==="
          free -h
          swapon --show

          if ! swapon --noheadings --raw --show=NAME | grep -Fxq "$SWAPFILE"; then
            echo "ERROR: Swap file is not active"
            exit 1
          fi

      - name: Build website
        id: build
        continue-on-error: true
        run: npm run build

      - name: Remove swap
        if: always()
        run: |
          if swapon --noheadings --raw --show=NAME | grep -Fxq /swapfile; then
            sudo swapoff /swapfile
          fi

          sudo rm -f /swapfile

          echo "=== Memory and swap after cleanup ==="
          free -h
          swapon --show

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
