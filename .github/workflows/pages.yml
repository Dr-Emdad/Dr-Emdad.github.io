name: Deploy to GitHub Pages

on:
  push:
    branches:
      - pages

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install
  
      - name: Check runner resources
        run: |
          echo "=== Memory ==="
          free -h
          echo "=== Disk ==="
          df -h .
          echo "=== Node ==="
          node --version
          node -e "console.log('Node heap limit:', require('v8').getHeapStatistics().heap_size_limit / 1024 / 1024, 'MiB')"

      - name: Build website
        env:
          DOCUSAURUS_PERF_LOGGER: "true"
        run: |
            npm run build
            echo $? done building, trying to upload
  

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
